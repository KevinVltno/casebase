<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do List TypeScript</title>
  </head>
  <body>
    <main class="container">
      <h1>To-Do List</h1>
      <form id="todo-form">
        <input
          id="todo-input"
          type="text"
          placeholder="Tulis tugas baru..."
          autocomplete="off"
        />
        <button type="submit">Tambah</button>
      </form>
      <div id="filter-bar">
        <button data-filter="semua" class="filter-btn aktif">Semua</button>
        <button data-filter="aktif" class="filter-btn">Aktif</button>
        <button data-filter="selesai" class="filter-btn">Selesai</button>
      </div>
      <p id="sisa-tugas"></p>
      <ul id="todo-list"></ul>
      <button id="hapus-selesai" type="button">Hapus yang Selesai</button>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
